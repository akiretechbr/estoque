<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Estoque baixo | AKIRE</title>
  <style>
    :root{--ink:#101a35;--muted:#6f7c94;--line:#dce4ef;--bg:#f4f7fb;--card:#fff;--green:#13a85b;--lime:#b7ff4a;--red:#d93838;--amber:#dd8a00}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:14px}.mark{width:54px;height:54px;border-radius:16px;background:#05091b;color:var(--lime);display:grid;place-items:center;font-weight:900}.eyebrow{font-size:12px;letter-spacing:.14em;color:#078d4b;font-weight:800;text-transform:uppercase}h1{font-size:clamp(28px,5vw,48px);margin:3px 0}.updated{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.value{font-size:34px;font-weight:850;margin-top:8px}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:15px}.search{width:100%;border:1px solid #cfd9e8;border-radius:12px;padding:13px 15px;font-size:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #e8edf4}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.qty{font-weight:850;font-size:18px}.critical{color:var(--red)}.warning{color:var(--amber)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff0f0;color:var(--red);font-size:12px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:38px}.error{background:#fff1f1;color:#9f2424;padding:14px;border-radius:12px;display:none;margin-bottom:15px}
    @media(max-width:700px){.wrap{padding:14px}.top{align-items:flex-start}.grid{grid-template-columns:1fr 1fr}.card{padding:15px}.value{font-size:27px}.panel{padding:14px}th:nth-child(4),td:nth-child(4){display:none}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div class="brand"><div class="mark">AK</div><div><div class="eyebrow">Controle de estoque</div><h1>Estoque baixo</h1><div id="updated" class="updated">Carregando dados…</div></div></div></header>
  <section class="grid">
    <article class="card"><div class="updated">Produtos monitorados</div><div class="value" id="total">—</div></article>
    <article class="card"><div class="updated">Abaixo do mínimo</div><div class="value critical" id="low">—</div></article>
    <article class="card"><div class="updated">Sem estoque</div><div class="value" id="zero">—</div></article>
  </section>
  <section class="panel"><div id="error" class="error"></div><div class="toolbar"><input id="search" class="search" placeholder="Procurar produto ou SKU" aria-label="Procurar produto ou SKU"></div>
    <div class="table-wrap"><table><thead><tr><th>Produto</th><th>SKU</th><th>Saldo</th><th>Mínimo</th><th>Situação</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>Nenhum produto encontrado.</div></div>
  </section>
</main><script>
let products=[];const fmt=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:3}).format(Number(n||0));
function render(){const q=document.querySelector('#search').value.trim().toLocaleLowerCase('pt-BR');const list=products.filter(p=>`${p.product} ${p.sku}`.toLocaleLowerCase('pt-BR').includes(q));const rows=document.querySelector('#rows');rows.innerHTML=list.map(p=>`<tr><td><strong>${esc(p.product)}</strong></td><td>${esc(p.sku||'—')}</td><td class="qty ${p.stock<=0?'critical':'warning'}">${fmt(p.stock)}</td><td>${fmt(p.minimum)}</td><td><span class="badge">${p.stock<=0?'SEM ESTOQUE':'ESTOQUE BAIXO'}</span></td></tr>`).join('');document.querySelector('#empty').hidden=!!list.length}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
fetch(`data/estoque.json?v=${Date.now()}`).then(r=>{if(!r.ok)throw new Error('Base ainda não publicada');return r.json()}).then(d=>{products=d.lowStock||[];document.querySelector('#total').textContent=d.summary?.monitored??0;document.querySelector('#low').textContent=products.length;document.querySelector('#zero').textContent=products.filter(p=>p.stock<=0).length;document.querySelector('#updated').textContent=d.updatedAt?`Atualizado em ${new Date(d.updatedAt).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})}`:'Aguardando primeira atualização';render()}).catch(e=>{const el=document.querySelector('#error');el.style.display='block';el.textContent=`Não foi possível carregar os dados: ${e.message}`;document.querySelector('#updated').textContent='Aguardando primeira atualização'});document.querySelector('#search').addEventListener('input',render);
</script></body></html>
